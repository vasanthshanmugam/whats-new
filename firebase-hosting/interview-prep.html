<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Testing Interview Preparation Bootcamp &mdash; Vasanth Tech Talk</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#F3F4F6;color:#6B7280;text-align:center;padding:24px;
  }
  #status{font-size:15px}
</style>
</head>
<body>
  <p id="status">Checking access&hellip;</p>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // Same project config as login.html.
    const firebaseConfig = {
      apiKey: "AIzaSyB2DSbIl6Jpt81hySqFna_NC5gplh4LnCY",
      authDomain: "interview-bootcamp-b5035.firebaseapp.com",
      projectId: "interview-bootcamp-b5035",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const statusEl = document.getElementById("status");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.href = "/login.html?redirect=/interview-prep.html";
        return;
      }
      try {
        const snap = await getDoc(doc(db, "protected", "interview-prep"));
        if (!snap.exists()) throw new Error("not-found");
        // Firestore Security Rules already verified this account is on the
        // allowlist before returning any data - this replaces the whole
        // document with the real page content.
        document.open();
        document.write(snap.data().html);
        document.close();

        const signOutBtn = document.createElement("button");
        signOutBtn.textContent = "Sign out";
        Object.assign(signOutBtn.style, {
          position: "fixed",
          top: "14px",
          right: "16px",
          zIndex: "9999",
          padding: "8px 16px",
          borderRadius: "8px",
          border: "none",
          background: "#1A1A1A",
          color: "#fff",
          fontSize: "13px",
          fontWeight: "600",
          cursor: "pointer",
          boxShadow: "0 4px 16px rgba(0,0,0,.2)",
        });
        signOutBtn.addEventListener("click", async () => {
          await signOut(auth);
          location.href = "/login.html";
        });
        document.body.appendChild(signOutBtn);
      } catch (err) {
        statusEl.textContent = "You don't have access to this page. Contact the instructor if this seems wrong.";
      }
    });
  </script>
</body>
</html>
